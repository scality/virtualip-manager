---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/name: virtualip-manager
  name: virtualip-manager
  namespace: default
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: virtualip-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: virtualip-manager
    spec:
      containers:
      - env:
        # Each DaemonSet replica must identify its own node: NODE_NAME decides
        # which addresses it owns (MASTER), NODE_IP is interpolated into the
        # healthcheck.
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NODE_IP
          value: 1.1.1.1
        image: example.com/virtualip-manager:v0.0.1
        imagePullPolicy: IfNotPresent
        name: virtualip-manager
        # The image entrypoint renders the configuration and then execs keepalived; the
        # argument is the spec to render, mounted from the ConfigMap.
        args:
        - /etc/keepalived/input/keepalived-input.yaml
        resources:
          limits:
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: true
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
            - NET_BIND_SERVICE
            - SETUID
            - SETGID
            drop:
            - ALL
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/keepalived/input
          name: virtualip-config
          readOnly: true
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      nodeSelector:
        role: virtualip
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          defaultMode: 420
          name: virtualip-manager-config
        name: virtualip-config
