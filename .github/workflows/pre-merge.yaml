name: "Pre Merge"

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    secrets: inherit
    with:
      is-development: true
      is-latest: false
      is-stable: false

  go-generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
      - name: Ensure go generate as been run if needed
        # We run go generate and then check if there are any changes
        run: |
          go generate ./... &&
          git diff --quiet

  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: 'go.mod'
      - name: Run linters
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2

  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  test-e2e:
    uses: ./.github/workflows/test-e2e.yml
    secrets: inherit

  generate-sbom:
    needs: build
    # 09/07/2026: Temporarily suspended: SBOM generation and upload to Dependency-Track
    if: false
    uses: ./.github/workflows/generate-sbom.yaml
    secrets: inherit
    with:
      image-name: ${{ needs.build.outputs.image-name }}
      image-version: ${{ needs.build.outputs.image-version }}
      upload-sbom: false
