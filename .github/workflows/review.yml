name: Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    uses: scality/workflows/.github/workflows/claude-code-review.yml@f05282f5bd6d7e90e8536400cf468f0a54681a48 # v2.10.0
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      ANTHROPIC_VERTEX_PROJECT_ID: ${{ secrets.ANTHROPIC_VERTEX_PROJECT_ID }}
      CLOUD_ML_REGION: ${{ secrets.CLOUD_ML_REGION }}
      # The review prompt is a slash command shipped by the scality-skills
      # plugin, which the shared workflow clones from the agent-hub marketplace
      # with this app key. Without it the plugin is skipped and the review
      # silently does nothing.
      ACTIONS_APP_PRIVATE_KEY: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}

  review-dependency-bump:
    # pr.user.login catches dependabot PRs updated by a human, where github.actor is no longer dependabot[bot].
    if: github.event_name == 'pull_request_target' && (github.actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]')
    uses: scality/workflows/.github/workflows/claude-code-dependency-review.yml@f05282f5bd6d7e90e8536400cf468f0a54681a48 # v2.10.0
    with:
      ACTIONS_APP_ID: ${{ vars.ACTIONS_APP_ID }}
    secrets:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      ANTHROPIC_VERTEX_PROJECT_ID: ${{ secrets.ANTHROPIC_VERTEX_PROJECT_ID }}
      CLOUD_ML_REGION: ${{ secrets.CLOUD_ML_REGION }}
      ACTIONS_APP_PRIVATE_KEY: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
