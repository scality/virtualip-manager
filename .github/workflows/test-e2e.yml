name: E2E Tests

on:
  workflow_call:

jobs:
  test-e2e:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Running Test e2e
        env:
          GIT_AUTH_TOKEN: ${{ secrets.GIT_ACCESS_TOKEN }}
        run: |
          go mod tidy
          #make test-e2e
